# electron-builder 打包配置。
# 产物进 release/，已在 .gitignore 里排除。
appId: com.focuslab.desktop
productName: Focus Lab
copyright: Focus Lab

directories:
  output: release
  buildResources: build

# 只打这几样：前端产物、主进程/preload、package.json。
# 前端依赖已经在 vite build 时打进 dist/ 了，不必再带一份源码。
# electron-updater 是例外：它是主进程在运行时 require 的，必须真的进包，
# 连它自己的依赖一起（builder-util-runtime / js-yaml / lodash.escaperegexp …）。
files:
  - dist/**
  - electron/**
  - package.json
  - node_modules/electron-updater/**
  - node_modules/builder-util-runtime/**
  - node_modules/lazy-val/**
  - node_modules/js-yaml/**
  - node_modules/argparse/**
  - node_modules/lodash.escaperegexp/**
  - node_modules/lodash.isequal/**
  - node_modules/semver/**
  - node_modules/tiny-typed-emitter/**
  - node_modules/fs-extra/**
  - node_modules/graceful-fs/**
  - node_modules/jsonfile/**
  - node_modules/universalify/**
  - node_modules/debug/**
  - node_modules/ms/**
  - node_modules/sax/**

# 更新从哪儿取。electron-builder 打包时按这里生成 app-update.yml（塞进包里，
# 运行时 electron-updater 读它）和 latest.yml（要跟安装包一起传到 Release 上，
# 少传这个文件的话客户端永远发现不了新版本）。
publish:
  - provider: github
    owner: angelicaserein
    repo: Focus_Lab

asar: true

win:
  # 没有 .ico，用 512 的 png，builder 会自己转
  icon: public/icon-512.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Focus Lab

mac:
  icon: public/icon-512.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  icon: public/icon-512.png
  category: Utility
  target:
    - AppImage
